[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cloudandsre"
version = "0.1.2"
description = "Shared Python utilities for AI-native cloud and SRE tools — retry, circuit breaker, throttle, token-cost meter, prompt-cache helper."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "Ajin Baby" }]
keywords = ["sre", "ai", "llm", "reliability", "circuit-breaker", "retry"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
  "Topic :: System :: Systems Administration",
]
dependencies = []

[project.urls]
Homepage = "https://cloudandsre.com"
Repository = "https://github.com/ajinb/cloudandsre-python"
Issues = "https://github.com/ajinb/cloudandsre-python/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.16,<0.17"]

[tool.hatch.build.targets.wheel]
packages = ["src/cloudandsre"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
